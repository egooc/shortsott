<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 오피스</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --side: #fbfbfc; --line: #e7e9ee; --line2: #f0f1f4;
  --text: #16181d; --muted: #6b7280; --faint: #9aa0aa;
  --accent: #3b6cff; --accent-soft: #eef2ff; --ok: #12a150; --warn: #d97706; --bad: #dc2626;
  --term-bg: #0f1218; --term-text: #d7dbe2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1014; --panel: #15181e; --side: #121419; --line: #23272f; --line2: #1b1e25;
    --text: #e8eaee; --muted: #9aa1ac; --faint: #6b717c;
    --accent: #7096ff; --accent-soft: #1b2236; --ok: #34c06f; --warn: #f0a33a; --bad: #f05252;
    --term-bg: #0a0c10; --term-text: #d7dbe2; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Pretendard Variable", Pretendard, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); padding: 7px 12px; font-weight: 500; }
button:hover { border-color: var(--faint); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.danger { color: var(--bad); }
button.small { padding: 4px 9px; font-size: 12.5px; }
button:disabled { opacity: .5; cursor: default; }
input, textarea, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; }

/* 레이아웃 */
#app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100vh; }
#app.with-panel { grid-template-columns: 264px minmax(0, 1fr) 460px; }
aside.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 18px 12px; display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid;
  place-items: center; font-weight: 800; font-size: 13px; }
.brand b { font-size: 15px; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
nav.top { padding: 4px 10px 8px; }
.navi { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 8px;
  cursor: pointer; color: var(--text); }
.navi:hover { background: var(--line2); }
.navi.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navi .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navi .n.hot { color: #fff; background: var(--bad); border-radius: 999px; padding: 0 7px; }
.tree { flex: 1; overflow: auto; padding: 4px 10px 12px; border-top: 1px solid var(--line); }
.tree h4 { font-size: 11.5px; color: var(--faint); font-weight: 600; margin: 14px 10px 6px; letter-spacing: .02em; }
.proj { margin-bottom: 2px; }
.proj > .navi { font-weight: 600; }
.sess { padding: 5px 10px 5px 24px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); }
.sess:hover { background: var(--line2); color: var(--text); }
.sess.on { background: var(--accent-soft); color: var(--accent); }
.sess span.t { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.d-busy { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.d-idle { background: var(--ok); } .d-stale { background: var(--warn); } .d-off { background: var(--faint); }
.devs { border-top: 1px solid var(--line); padding: 10px 18px 14px; font-size: 12.5px; color: var(--muted); }
.devs div { display: flex; align-items: center; gap: 8px; padding: 2px 0; }

main { overflow: auto; min-width: 0; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 28px 14px;
  position: sticky; top: 0; background: var(--bg); z-index: 2; }
.head h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
.head .sub { color: var(--muted); font-size: 13px; }
.head .acts { display: flex; gap: 8px; align-items: center; }
.body { padding: 4px 28px 40px; display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; overflow-x: auto; }
.body > *, .grid2 > * { min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.card h2 .muted { font-weight: 400; }
.muted { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line2); }
.todo li:first-child { border-top: 0; }
.todo .num { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--panel); display: grid;
  place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.todo .txt { flex: 1; min-width: 0; }
.todo .txt b { display: block; font-weight: 600; }
.todo .txt span { color: var(--muted); font-size: 12.5px; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.pcard:hover { border-color: var(--faint); }
.pcard b { font-size: 15px; }
.pcard .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.dev + .dev { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line2); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 11px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; font-size: 13.5px; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--line2); }
td .last { color: var(--muted); font-size: 12.5px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px; padding: 2px 9px;
  background: var(--line2); color: var(--muted); white-space: nowrap; }
.pill.busy { background: var(--accent-soft); color: var(--accent); }
.pill.stale { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.chip { display: inline-block; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.tab.on { background: var(--panel); color: var(--text); font-weight: 600; border: 1px solid var(--line); }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.log li { font-size: 13px; }
/* 프로젝트 대시보드 섹션 */
.ptabs { flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-busy { color: var(--accent); } .t-muted { color: var(--muted); }
.num.n-bad { background: var(--bad); color: #fff; } .num.n-warn { background: var(--warn); color: #fff; } .num.n-busy { background: var(--accent); color: #fff; }
.pipe { display: flex; align-items: center; gap: 8px; overflow-x: auto; }
.pipe .stage { flex: 1; min-width: 90px; text-align: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; }
.pipe .stage .v { font-size: 24px; font-weight: 700; }
.pipe .arrow { color: var(--faint); font-size: 22px; }
.tw { overflow-x: auto; }
.cellsub { font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); gap: 10px; overflow-x: auto; }
.cal .day { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 120px; }
.cal .dh { font-weight: 600; font-size: 13px; padding-bottom: 6px; border-bottom: 1px solid var(--line2); margin-bottom: 6px; }
.cal .ev { font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--line2); }
.cal .ev:last-child { border-bottom: 0; }
@media (max-width: 760px) { .cal { grid-template-columns: 1fr; } }

/* 오른쪽 세션 패널 */
aside.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ph { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.ph .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ph b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.screen { flex: 1; overflow: auto; background: var(--term-bg); color: var(--term-text); margin: 12px; border-radius: 10px;
  padding: 12px 14px; font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 8px; }
.composer { display: flex; gap: 8px; padding: 0 12px 14px; align-items: flex-end; }
.composer textarea { min-height: 44px; max-height: 160px; }
.composer button { white-space: nowrap; }

/* 모달 */
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(460px, 100%); display: grid; gap: 12px; }
.modal h3 { margin: 0; font-size: 16px; }
.modal label { font-size: 12.5px; color: var(--muted); display: grid; gap: 5px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
  padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 20; }

#login { max-width: 360px; margin: 14vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px; display: grid; gap: 10px; }
#login h1 { font-size: 20px; margin: 0 0 8px; }
#err { color: var(--bad); font-size: 13px; min-height: 18px; }
.only-m { display: none; }

/* 머리 */
.ht h1 { margin: 0; }
.pillrow { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
h3.sh { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 2px 10px; display: flex; align-items: center; gap: 8px; }
.cnt { font-size: 12px; background: var(--line2); color: var(--muted); border-radius: 999px; padding: 0 8px; }
.cnt.hot { background: var(--bad); color: #fff; }
.card.tight { padding: 4px 16px; }
.card.empty { text-align: center; }
.grid2 > div > .card + .card, .grid2 > div > .dcard + .dcard { margin-top: 10px; }
.grid2 > div > h3.sh:not(:first-child) { margin-top: 22px; }

/* 결정 카드 */
.dcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.dtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
.lane { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
.q { font-size: 15px; line-height: 1.55; font-weight: 500; cursor: pointer; }
.q.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.dopts { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; width: 100%;
  padding: 11px 14px; border-radius: 11px; font-weight: 600; font-size: 14px; }
.small-note { font-size: 12px; white-space: nowrap; }
.askprev { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 8px 0 10px; font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; }
.opt small { flex: none; white-space: nowrap; font-size: 11px; color: var(--accent); font-weight: 600; }
.opt.rec { border-color: var(--accent); }
.opt.ghost { color: var(--muted); font-weight: 500; border-style: dashed; }
.opt.armed { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt.armed small { color: #fff; }
.opt em { font-style: normal; font-size: 12px; font-weight: 500; opacity: .9; }
.ans { margin-top: 8px; font-weight: 600; color: var(--ok); }
.who { font-size: 12px; margin-top: 8px; }
.more { width: 100%; margin-top: 4px; }

/* 확인할 것·기기 줄 */
.arow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line2); font-size: 14px; cursor: default; }
.arow:first-child { border-top: 0; }
.arow[data-act] { cursor: pointer; }
.arow .at { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--faint); font-size: 18px; margin-left: auto; }
.d-bad { background: var(--bad); }

/* 프로젝트 카드 */
.pcard2 { cursor: pointer; margin-bottom: 10px; }
.pcard2.sub { margin-left: 18px; border-left: 3px solid var(--accent); }
.ptile.sub { padding-left: 26px; }
.ptile.sub .pav { width: 22px; height: 22px; font-size: 11px; }
.pbar { height: 6px; border-radius: 3px; background: var(--line2); overflow: hidden; width: 100%; }
.pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.pcard2 .pt { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pcard2 .pt b { font-size: 16px; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini .mv { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.mini .muted { font-size: 11.5px; }

/* 세션 목록 */
.slist { display: grid; }
.srow { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line2); cursor: pointer; }
.srow:first-child { border-top: 0; }
.srow:hover { background: var(--line2); }
.srow .sm { flex: 1; min-width: 0; }
.srow .st { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .ss, .srow .sl { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.ghost { background: transparent; }

/* 왼쪽: 버튼형 메뉴·프로젝트 타일 */
nav.top { display: grid; gap: 2px; }
.navb { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 10px; color: var(--text); text-align: left; }
.navb:hover { background: var(--line2); }
.navb.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navb .ic { width: 20px; text-align: center; font-size: 15px; opacity: .85; }
.navb .n { margin-left: auto; font-size: 12px; color: var(--muted); }
.navb .n.hot { color: #fff; background: var(--bad); border-radius: 999px; padding: 0 7px; }
.navb .n.warn { color: #fff; background: var(--warn); border-radius: 999px; padding: 0 7px; }
.ptile { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border-radius: 12px; }
.ptile.on { border-color: var(--accent); background: var(--accent-soft); }
.pav { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.ptile .pn { display: grid; flex: 1; min-width: 0; } .ptile .pn small { color: var(--muted); font-size: 12px; }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--panel); }
.dchip.off { color: var(--faint); }

/* 한도 미터 */
.meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.meters .meter { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.meter .mh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.meters .meter .mh b { font-size: 22px; letter-spacing: -.02em; }
.bar { height: 7px; border-radius: 4px; background: var(--line2); overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.b-ok { background: var(--ok); } .b-warn { background: var(--warn); } .b-bad { background: var(--bad); }
.devs .mmini { display: grid; gap: 8px; padding: 0; }
.devs .mmini .meter { display: block; padding: 0; }
.devs .mmini .mh { display: flex; justify-content: space-between; font-size: 12px; padding: 0; }
.devs .mmini .bar { display: block; height: 5px; margin: 4px 0 0; padding: 0; }
.devs .dchips { display: flex; padding: 0; }
.card:has(> .sgrid) { background: none; border: 0; padding: 0; }

/* 세션 카드 */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.scard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; border-top: 3px solid var(--line); }
.scard.s-busy { border-top-color: var(--accent); } .scard.s-idle { border-top-color: var(--ok); } .scard.s-stale { border-top-color: var(--warn); } .scard.s-off { border-top-color: var(--faint); }
.scard .stop { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.spill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--muted); }
.spill.busy { color: var(--accent); } .spill.stale { color: var(--warn); } .spill.idle { color: var(--ok); }
.scard .st { font-weight: 700; font-size: 15px; cursor: pointer; }
.kind { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.scard .ss { font-size: 12.5px; }
.scard .sl { font-size: 12.5px; color: var(--text); opacity: .8; min-height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sbtns { display: flex; gap: 6px; margin-top: 4px; }
.ctx { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ctx .bar { margin: 0; height: 5px; }
.xcard { cursor: pointer; }
.agrid { align-items: start; }
.acard.tall .at { flex: none; }
.xcard .xd { display: none; width: 100%; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line2); font-size: 13.5px; line-height: 1.6; }
.xcard.open .xd { display: grid; gap: 8px; }
.xcard .xd > div:first-child { white-space: pre-line; }
.xcard .xrec { background: var(--accent-soft); color: var(--text); border-radius: 8px; padding: 8px 10px; }
.xcard .xrec b { color: var(--accent); margin-right: 6px; }
.xcard .xb { display: flex; gap: 6px; flex-wrap: wrap; }
.xcard::after { content: '펼치기 ›'; font-size: 12px; color: var(--accent); }
.xcard.open::after { content: none; }
.card.plan { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line2); }
.card.plan h2 + .prow { border-top: 0; }
.prow .pn2 { width: 24px; height: 24px; border-radius: 50%; background: var(--warn); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }

/* 알림·기록 카드 */

/* 대시보드 표 → 카드 격자(모든 폭) */

/* 영상 칸은 처음부터 크기 고정(쇼츠 세로·롱폼 가로) — 로딩 중에 버튼이 밀리지 않게 */

  padding: 10px 12px; font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }

  aside.panel { position: fixed; inset: 0; z-index: 7; } .grid2 { grid-template-columns: 1fr; } }

  main { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

  .hide-m { display: none !important; }

  /* 서랍(한도·기기·알림·기록) 여는 단추: 페이지 왼쪽 위 */
  .menub { display: grid; place-items: center; position: absolute; top: 14px; left: 12px; z-index: 5; width: 40px; height: 40px; padding: 0;
    border-radius: 12px; font-size: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px rgb(0 0 0 / .08); }

    background: var(--panel); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 1px; font-size: 11px; color: var(--muted); padding: 4px 0; position: relative; }

  table.rt tbody, .sgrid, .agrid { grid-template-columns: 1fr; }
  textarea, input, select { font-size: 16px; } /* 아이폰: 16px 미만이면 입력할 때 화면이 확대된다 */

  .pipe { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; overflow: visible; }
  .pipe .arrow { display: none; }

  .tabs, .ptabs { flex-wrap: wrap; gap: 6px; }

<body>
<div id="login" hidden>
  <h1>AI 오피스</h1>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div id="err"></div>
  <button class="primary" id="go">로그인</button>
</div>

<div id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><div class="logo">AI</div><div><b>AI 오피스</b><small id="stamp">불러오는 중</small></div></div>
    <nav class="top" id="nav"></nav>
    <div class="tree" id="tree"></div>
    <div class="devs" id="devs"></div>
    <div class="devs" id="pushbox"></div>
  </aside>
  <main id="main"></main>
  <button class="menub only-m" data-act="menu" aria-label="메뉴">☰</button>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="fab" id="fab"></div>
  <aside class="panel" id="panel" hidden></aside>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(OFFICE.url, OFFICE.anon);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 프로젝트 이름: Orca 저장소 이름 → 한국어. 없는 건 저장소 이름 그대로.
const PROJECT_NAMES = { shortsott: '유튜브', growupup: '그로우업', rocky_roblox: '로블록스', midform: '유튜브' };
// 소유주가 끝낸 프로젝트 — 목록에서 숨긴다(파일·Orca 등록은 그대로). 10-29 로블록스 종료.
const HIDDEN_PROJECTS = new Set(['rocky_roblox']);
const DEVICE_NAMES = { 'main-pc': '메인 PC', 'mini-pc': '미니 PC', laptop: '노트북', n100: 'N100', vps: 'VPS' };
const AGENT_NAMES = { claude: '클로드', codex: 'GPT', opencode: 'OpenCode' };
const QUICK = [
  ['마저 끝까지', '하던 일 마저 끝까지 진행해.'],
  ['진행 상황', '지금 진행 상황을 세 줄로 알려줘. 막힌 게 있으면 무엇이 필요한지도.'],
  ['마무리 요청', '이 프로젝트를 여기서 멈춘다. 다음에 이어서 할 수 있게 인계 파일을 남기고, 그 경로를 한 줄로 알려줘.'],
];

let S = { devices: [], decisions: [], actions: [] };
let view = { page: 'home', project: null, session: null, tab: 'all' };
let panelTimer = null;

const devName = (d) => DEVICE_NAMES[d] || d;
const ago = (ms) => {
  if (!ms) return '기록 없음';
  const m = Math.round((Date.now() - ms) / 60e3);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`;
  const h = Math.round(m / 60); if (h < 48) return `${h}시간 전`;
  return `${Math.round(h / 24)}일 전`;
};
function status(s, online) {
  if (!online) return 'off';
  const m = (Date.now() - (s.last_output_at || 0)) / 60e3;
  if (m < 3) return 'busy';
  if (m > 24 * 60) return 'stale';
  return 'idle';
}
// 대화 크기: 다음 턴마다 다시 읽는 토큰. 25만 넘으면 주의, 40만 넘으면 비우기 권장.
const BIG_CTX = 250000;
const fmtK = (n) => n >= 10000 ? `${(n / 10000).toFixed(1)}만` : n.toLocaleString('ko-KR');
const ctxTone = (n) => n >= 400000 ? 'bad' : n >= BIG_CTX ? 'warn' : 'ok';
const modelName = (m) => /fable/.test(m) ? 'Fable' : /opus/.test(m) ? 'Opus' : /sonnet/.test(m) ? 'Sonnet' : /haiku/.test(m) ? 'Haiku' : m;
const STATUS_TEXT = { busy: '작업 중', idle: '대기', stale: '오래 멈춤', off: '기기 꺼짐' };
// 화면 미리보기에서 상태줄·안내문을 걷어 내고 마지막 «말» 한 줄만.
const NOISE = /new task\?|clear to save|Update installed|Restart to update|for shortcuts|bypass permissions|auto mode|shift\+tab|esc to interrupt|disable recaps|^[>❯]\s*$/i;
const lastLine = (p, title) => String(p || '').split('\n').map((l) => l.replace(/[─━│┃╭╮╰╯▔▁]+/g, '').trim())
  .filter((l) => l && l !== title && !NOISE.test(l)).slice(-1)[0] || '';

// 모든 기기의 세션을 프로젝트별로 묶는다.
function model() {
  const projects = new Map();
  const all = [];
  for (const d of S.devices) {
    const st = d.state || {};
    const repos = new Map((st.repos || []).map((r) => [r.id, r]));
    for (const s of st.sessions || []) {
      const repo = repos.get(s.repo_id);
      const key = repo ? repo.name : (s.folder ? s.folder.split(/[\\/]/).filter(Boolean).slice(-1)[0] : '기타');
      const x = { ...s, title: s.title ? s.title.replace(/^[^\p{L}\p{N}]+/u, '') : s.title, device: d.device, online: d.online, project: key, status: status(s, d.online) };
      all.push(x);
      if (!projects.has(key)) projects.set(key, { key, name: PROJECT_NAMES[key] || key, sessions: [], repos: [] });
      projects.get(key).sessions.push(x);
    }
    for (const r of st.repos || []) {
      if (!projects.has(r.name)) projects.set(r.name, { key: r.name, name: PROJECT_NAMES[r.name] || r.name, sessions: [], repos: [] });
      projects.get(r.name).repos.push({ ...r, device: d.device, online: d.online });
    }
  }
  // 현황판: 모듈이 board:{parent, sessions, manager} 를 단 대시보드(잡탕 광산·발굴분석·도구개발 등)는 따로 뜬다.
  const boards = [];
  const seen = new Set();
  for (const d of S.devices) for (const [key, db] of Object.entries(d.state?.dashboards || {})) {
    if (!db?.board || seen.has(key)) continue;
    seen.add(key);
    const names = (db.board.sessions || []).map(cleanTitle);
    boards.push({ key, name: db.title || key, board: db.board, repos: [],
      sessions: all.filter((x) => names.some((n) => cleanTitle(x.title).startsWith(n))) });
  }
  for (const p of projects.values()) p.sessions.sort((a, b) => (b.last_output_at || 0) - (a.last_output_at || 0));
  const top = [...projects.values()].filter((p) => !HIDDEN_PROJECTS.has(p.key))
    .sort((a, b) => b.sessions.length - a.sessions.length || a.name.localeCompare(b.name, 'ko'));
  const list = [];
  for (const p of top) { list.push(p); list.push(...boards.filter((b) => b.board.parent === p.key)); }
  list.push(...boards.filter((b) => !top.some((p) => p.key === b.board.parent)));
  return { projects: list, all };
}

async function token() { return (await sb.auth.getSession()).data.session?.access_token; }
async function call(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { authorization: `Bearer ${await token()}`, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { await sb.auth.signOut(); show(); throw new Error('다시 로그인'); }
  return j;
}
const cmd = (device, op, args, label) => call('/api/cmd', { device, op, args, label });
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }

async function load() {
  try { S = await call('/api/state'); } catch { return; }
  $('stamp').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  render(true);
}

// ── 왼쪽 ──
// 구독 한도: 기기들이 올린 값 중 가장 최근 것(Orca 가 상태줄에서 받아 둔 값).
function limitsNow() {
  let best = null;
  for (const d of S.devices) {
    const l = d.state?.limits;
    const t = Math.max(l?.claude?.updated_at || 0, l?.codex?.updated_at || 0);
    if (l && (!best || t > best.t)) best = { t, l };
  }
  if (!best) return [];
  const { l } = best;
  const out = [];
  const add = (label, w, sub) => { if (w && w.used != null) out.push({ label, used: w.used, resets_at: w.resets_at, sub }); };
  add('클로드 5시간', l.claude?.session);
  add('클로드 주간', l.claude?.weekly);
  add('Fable 주간', l.claude?.fable_weekly);
  add('GPT 주간', l.codex?.weekly);
  return out;
}
const resetText = (ms) => {
  if (!ms) return '';
  const m = Math.round((ms - Date.now()) / 60e3);
  if (m <= 0) return '곧 초기화';
  if (m < 60) return `${m}분 뒤 초기화`;
  if (m < 48 * 60) return `${Math.round(m / 60)}시간 뒤 초기화`;
  return `${Math.round(m / 1440)}일 뒤 초기화`;
};
const meterTone = (p) => p >= 85 ? 'bad' : p >= 60 ? 'warn' : 'ok';
function meters(list, compact) {
  if (!list.length) return '';
  return `<div class="${compact ? 'mmini' : 'meters'}">${list.map((m) => `<div class="meter">
    <div class="mh"><span>${esc(m.label)}</span><b class="t-${meterTone(m.used)}">${m.used}%</b></div>
    <div class="bar"><i class="b-${meterTone(m.used)}" style="width:${Math.min(100, m.used)}%"></i></div>
    ${compact ? '' : `<div class="muted">${resetText(m.resets_at)}</div>`}</div>`).join('')}</div>`;
}

function renderSide(M) {
  const open = S.decisions.filter((d) => d.status === 'open').length;
  const stale = M.all.filter((s) => s.status === 'stale').length;
  const nav = [['home', '⌂', '오늘', ''], ['decisions', '✓', '결정', open ? `<span class="n hot">${open}</span>` : ''],
    ['results', '▣', '결과물', ''], ['tidy', '◎', '세션', stale ? `<span class="n warn">${stale}</span>` : `<span class="n">${M.all.length}</span>`], ['log', '≡', '기록', '']];
  $('nav').innerHTML = nav.map(([k, ic, t, n]) => `<button class="navb ${view.page === k ? 'on' : ''}" data-page="${k}"><span class="ic">${ic}</span><span>${t}</span>${n}</button>`).join('');
  $('tree').innerHTML = '<h4>프로젝트</h4>' + M.projects.map((p) => {
    const busy = p.sessions.filter((s) => s.status === 'busy').length;
    return `<button class="ptile ${p.board ? 'sub' : ''} ${view.page === 'project' && view.project === p.key ? 'on' : ''}" data-project="${esc(p.key)}">
      <span class="pav">${esc(p.name.slice(0, 1))}</span>
      <span class="pn"><b>${esc(p.name)}</b><small>세션 ${p.sessions.length}${busy ? ` · 작업 중 ${busy}` : ''}</small></span>
      ${busy ? '<span class="dot d-busy"></span>' : ''}</button>`;
  }).join('');
  $('devs').innerHTML = meters(limitsNow(), true) + `<div class="dchips">${S.devices.map((d) => `<span class="dchip ${d.online ? '' : 'off'}"><span class="dot ${d.online ? 'd-idle' : 'd-off'}"></span>${esc(devName(d.device))}</span>`).join('')}</div>`;
}

// ── 가운데 ──
function head(title, sub, acts = '') {
  return `<div class="head"><div class="ht"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="acts">${acts}</div></div>`;
}
const NEW_BTN = '<button class="primary" data-act="new"><span class="hide-m">+ 새 세션</span><span class="only-m">＋</span></button>';

// 세션 카드: 상태 띠·이름·어디서·마지막 한 줄 + 버튼(열기·진행 상황·닫기).
function sessionTable(rows, opts = {}) {
  if (!rows.length) return '<div class="card empty">세션이 없습니다.</div>';
  return `<div class="sgrid">${rows.map((s) => {
    const last = lastLine(s.preview, s.title);
    return `<div class="scard s-${s.status}">
      <div class="stop"><span class="spill ${s.status}"><span class="dot d-${s.status}"></span>${STATUS_TEXT[s.status]}</span><span class="muted">${ago(s.last_output_at)}</span></div>
      <div class="st" data-session="${esc(s.handle)}">${niceHtml(s.title)}</div>
      <div class="muted ss">${opts.project ? esc(PROJECT_NAMES[s.project] || s.project) + ' · ' : ''}${esc(devName(s.device))} · ${esc(AGENT_NAMES[s.agent] || s.agent || '터미널')}${s.model ? ' · ' + esc(modelName(s.model)) : ''}</div>
      ${s.context_tokens ? `<div class="ctx c-${ctxTone(s.context_tokens)}"><span>대화 ${fmtK(s.context_tokens)}</span><div class="bar"><i class="b-${ctxTone(s.context_tokens)}" style="width:${Math.min(100, s.context_tokens / 6000)}%"></i></div></div>` : ''}
      <div class="sl">${last ? esc(last) : '<span class="muted">—</span>'}</div>
      <div class="sbtns"><button class="small" data-open="${esc(s.handle)}">열기</button>
        ${s.online && s.agent ? `<button class="small" data-qsend="${esc(s.handle)}">진행</button>` : ''}
        ${s.online && s.agent === 'claude' ? (s.compacting ? '<button class="small" disabled>비우는 중…</button>' : `<button class="small" data-compact="${esc(s.handle)}">비우기</button>`) : ''}
        ${s.online ? `<button class="small danger" data-close="${esc(s.handle)}">닫기</button>` : ''}</div>
    </div>`;
  }).join('')}</div>`;
}

// «수정·보완·다시·조건부» 같은 선택지는 무엇을 고칠지 적어야 뜻이 통한다 — 누르면 글 칸이 열린다.
const NEEDS_NOTE = /수정|고쳐|고치|바꿔|바꾸|변경|보완|다시|조건|기타|직접/;

// 결정 카드: 질문은 3줄까지(눌러서 펼침), 선택지는 큰 버튼. 한 번 누르면 «한 번 더 눌러 확정».
function decisionCard(d) {
  const open = d.status === 'open';
  const ms = (d.media || []).map(mediaById).filter(Boolean);
  return `<div class="dcard">
    ${ms.length ? `<div class="dmedia ${ms.length > 1 ? 'multi' : ''}">${ms.map((m) => mediaEl(m, ms.length === 1)).join('')}</div>` : ''}
    <div class="dtop"><span class="lane">${esc(d.lane)}</span><span class="muted">${ago(Date.parse(d.created_at))}</span></div>
    <div class="q clamp" data-act="expand">${esc(d.question)}</div>
    ${open ? `<div class="dopts">${(d.options || []).map((o) => `<button class="opt ${o === d.recommended ? 'rec' : ''}" data-answer="${d.id}" data-value="${esc(o)}">
        <span>${esc(o)}${NEEDS_NOTE.test(o) ? ' <small class="muted">✎ 적기</small>' : ''}</span>${o === d.recommended ? '<small>추천</small>' : ''}</button>`).join('')}
        <button class="opt ghost" data-answer="${d.id}" data-value="">선택지에 없는 답 쓰기</button></div>`
      : `<div class="ans">→ ${esc(d.answer)}</div>`}
    ${d.asked_by ? `<div class="muted who">${esc(d.asked_by)}</div>` : ''}
  </div>`;
}

function homeAlerts(M) {
  const out = [];
  const stale = M.all.filter((s) => s.status === 'stale');
  if (stale.length) out.push({ tone: 'warn', t: `하루 넘게 멈춘 세션 ${stale.length}개`, act: 'page:tidy' });
  const plan = compactPlan(M).now;
  if (plan.length) out.push({ tone: 'warn', t: `비우기 추천 ${plan.length}개`, s: plan.slice(0, 3).map((x) => `${nice(x.s.title).name} ${fmtK(x.s.context_tokens)}`).join(' · '), act: 'page:tidy' });
  for (const d of S.devices.filter((d) => !d.online)) out.push({ tone: 'bad', t: `${devName(d.device)} 연결 끊김`, s: d.state?.at ? ago(Date.parse(d.state.at)) : '' });
  for (const d of S.devices) if ((d.state?.render_locks || []).length) out.push({ tone: 'busy', t: `${devName(d.device)} 렌더 중` });
  for (const p of M.projects) {
    const db = dashboardFor(p.key);
    const st = db?.tabs?.[0]?.sections?.find((s) => s.type === 'stats');
    for (const i of st?.items || []) if (i.tone === 'bad' && i.value) out.push({ tone: 'bad', t: `${p.name} · ${i.label} ${i.value}`, act: `project:${p.key}` });
  }
  return out;
}

function projCard(p) {
    const db = dashboardFor(p.key);
    const stats = (db?.tabs?.[0]?.sections?.find((s) => s.type === 'stats')?.items || []).slice(0, 3);
    const b = p.sessions.filter((s) => s.status === 'busy').length;
    const parent = p.board ? (PROJECT_NAMES[p.board.parent] || p.board.parent) : '';
    return `<div class="card pcard2 ${p.board ? 'sub' : ''}" data-project="${esc(p.key)}">
      <div class="pt">${parent ? `<span class="muted">${esc(parent)} ·</span>` : ''}<b>${esc(p.name)}</b><span class="muted">세션 ${p.sessions.length}${b ? ` · <span class="t-busy">작업 중 ${b}</span>` : ''}</span><span class="chev">›</span></div>
      ${stats.length ? `<div class="mini">${stats.map((i) => `<div><div class="mv ${i.tone ? 't-' + i.tone : ''}">${esc(i.value)}</div><div class="muted">${esc(i.label)}</div></div>`).join('')}</div>`
        : `<div class="muted">${db ? '' : '대시보드 준비 중'}</div>`}
    </div>`;
}
// 폰 아래 탭 «프로젝트»: 서랍 대신 프로젝트 카드만 모은 화면
function renderProjects(M) {
  return `<div class="head"><div><h1>프로젝트</h1><div class="muted">누르면 그 프로젝트 대시보드</div></div></div>
  <div class="body">${M.projects.map(projCard).join('') || '<div class="empty">프로젝트가 없습니다.</div>'}</div>`;
}
function renderHome(M) {
  const open = S.decisions.filter((d) => d.status === 'open');
  const alerts = homeAlerts(M);
  const busy = M.all.filter((s) => s.status === 'busy').length;
  const online = S.devices.filter((d) => d.online).length;
  return head('오늘', `<span class="pillrow"><span class="pill">세션 ${M.all.length}</span><span class="pill busy">작업 중 ${busy}</span><span class="pill">기기 ${online}/${S.devices.length}</span></span>`, NEW_BTN)
    + `<div class="body">
    ${meters(limitsNow())}
    <div class="grid2">
      <div>
        <h3 class="sh">결정 대기 <span class="cnt ${open.length ? 'hot' : ''}">${open.length}</span></h3>
        ${open.length ? open.slice(0, 5).map(decisionCard).join('') + (open.length > 5 ? `<button class="more" data-act="page:decisions">${open.length - 5}개 더 보기</button>` : '')
          : '<div class="card empty">기다리는 결정이 없습니다.</div>'}
        ${(S.media || []).some((m) => !m.by_owner) ? `<h3 class="sh">최근 결과물 <button class="small ghost" data-act="page:results" style="margin-left:auto">전체 보기 ›</button></h3>
          <div class="mgrid two">${(S.media || []).filter((m) => !m.by_owner).slice(0, 4).map(mediaCard).join('')}</div>` : ''}
      </div>
      <div>
        ${alerts.length ? `<h3 class="sh">확인할 것</h3>${alerts.map((a) => `<div class="acard a-${a.tone} ${a.s && a.s.length > 12 ? 'tall' : ''}" ${a.act ? `data-act="${esc(a.act)}"` : ''}>
          <span class="at">${esc(a.t)}</span>${a.s ? `<span class="muted">${esc(a.s)}</span>` : ''}${a.act ? '<span class="go">보기 ›</span>' : ''}</div>`).join('')}` : ''}
        <h3 class="sh">프로젝트</h3>
        ${M.projects.map(projCard).join('')}
        <h3 class="sh">기기</h3>
        <div class="card tight">${S.devices.map((d) => {
          const r = d.state?.snapshot?.resources || {};
          const ram = r.ram_total_gb ? Math.round(r.ram_used_gb / r.ram_total_gb * 100) : null;
          return `<div class="arow"><span class="dot ${d.online ? 'd-idle' : 'd-off'}"></span><span class="at">${esc(devName(d.device))}</span>
            <span class="muted">${d.online ? `세션 ${(d.state?.sessions || []).length}${r.cpu_pct != null ? ` · CPU ${r.cpu_pct}% · 램 ${ram}%` : ''}` : '꺼짐'}</span>${cuButton(d)}</div>`;
        }).join('') || '<div class="empty">연결된 기기가 없습니다.</div>'}</div>
      </div>
    </div>
  </div>`;
}

// ── 프로젝트 대시보드 (기기 연결기의 office/modules/*.js 가 만든 JSON 을 그린다) ──
function dashboardFor(key) {
  let best = null;
  for (const d of S.devices) {
    const db = d.state?.dashboards?.[key];
    if (db && (!best || Date.parse(db.updated_at || 0) > Date.parse(best.updated_at || 0))) best = { ...db, device: d.device };
  }
  return best;
}
const cell = (c) => c == null ? '—' : typeof c === 'object'
  ? `<div class="cv"><span class="${c.tone ? 't-' + c.tone : ''}">${esc(c.text)}</span>${c.sub ? `<div class="muted cellsub">${esc(c.sub)}</div>` : ''}</div>` : esc(c);
const SECTIONS = {
  stats: (s) => `<div class="stats">${s.items.map((i) => `<div class="stat"><div class="muted">${esc(i.label)}</div>
    <div class="v ${i.tone ? 't-' + i.tone : ''}">${esc(i.value)}</div>${i.sub ? `<div class="muted">${esc(i.sub)}</div>` : ''}</div>`).join('')}</div>`,
  pipeline: (s) => `<div class="pipe">${s.stages.map((st, i) => `${i ? '<div class="arrow">›</div>' : ''}<div class="stage"><div class="v">${esc(st.count)}</div><div class="muted">${esc(st.label)}</div></div>`).join('')}</div>`,
  // 폰에서는 표가 카드로 바뀐다(첫 칸이 제목, 나머지는 «머리글: 값» 줄).
  table: (s) => s.rows.length ? `<div class="tw"><table class="rt"><thead><tr>${s.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${s.rows.map((r) => `<tr>${r.map((c, i) => `<td data-label="${esc(s.columns[i] || '')}">${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<div class="empty">${esc(s.empty || '없습니다.')}</div>`,
  // 카드를 누르면 설명·추천이 펼쳐지고 [담당에게 묻기]·[세션 열기]. 모듈이 detail·rec·session(세션 이름)을 채운다.
  list: (s) => s.items.length ? `<div class="agrid">${s.items.map((i) => {
    const sess = i.session && CUR_M ? findByTitle(CUR_M, i.session) : null;
    const ask = JSON.stringify({ title: i.title, sub: i.sub || '', detail: i.detail || '', rec: i.rec || '', session: sess ? nice(sess.title).name : (i.session || '') });
    return `<div class="acard a-${i.tone || 'muted'} tall xcard" data-act="xpand">
    <span class="at">${esc(i.title)}${i.pct != null ? ` <span class="muted">${esc(i.pct)}%</span>` : ''}</span>${i.pct != null ? `<span class="pbar"><i style="width:${Math.max(0, Math.min(100, +i.pct || 0))}%"></i></span>` : ''}${i.sub ? `<span class="muted">${esc(i.sub)}</span>` : ''}${i.right ? `<span class="muted">${esc(i.right)}</span>` : ''}
    <div class="xd">${i.detail ? `<div>${esc(i.detail)}</div>` : ''}${i.rec ? `<div class="xrec"><b>추천</b> ${esc(i.rec)}</div>` : ''}
      <div class="xb"><button class="small primary" data-askmgr="${esc(ask)}">담당에게 묻기</button>${sess ? `<button class="small" data-open="${esc(sess.handle)}">${esc(nice(sess.title).name)} 열기</button>` : ''}</div></div></div>`;
  }).join('')}</div>`
    : `<div class="empty">${esc(s.empty || '없습니다.')}</div>`,
  calendar: (s) => `<div class="cal">${s.days.map((d) => `<div class="day"><div class="dh">${esc(d.label)} <span class="muted">${d.items.length}</span></div>
    ${d.items.map((i) => `<div class="ev"><b>${esc(i.time)}</b> ${esc(i.text)}${i.sub ? `<div class="muted">${esc(i.sub)}</div>` : ''}</div>`).join('') || '<div class="muted" style="padding:6px 0">비어 있음</div>'}</div>`).join('')}</div>`,
  note: (s) => `<div class="muted">${esc(s.text)}</div>`,
};
function section(s) {
  const fn = SECTIONS[s.type];
  if (!fn) return '';
  const bare = s.type === 'stats' && !s.title;
  return bare ? fn(s) : `<div class="card">${s.title ? `<h2>${esc(s.title)}</h2>` : ''}${fn(s)}${s.note ? `<div class="muted" style="margin-top:8px">${esc(s.note)}</div>` : ''}</div>`;
}

// ── 결과물(이미지·영상) ──
// 영상 모양은 로딩 전에 정한다: 서버가 올릴 때 잰 크기 → 이 기기가 본 적 있는 모양 → 레인·제목 짐작(기본 쇼츠 세로).
const SHAPES = (() => { try { return JSON.parse(localStorage.getItem('vshape') || '{}'); } catch { return {}; } })();
function videoShape(m) {
  if (m.width && m.height) return m.width > m.height ? 'wide' : 'tall'; // 올릴 때 서버가 잰 크기
  if (SHAPES[m.id]) return SHAPES[m.id];
  return /롱폼|기업흥망|연금|정치 ?(ko|JA)? ?롱|1시간|long/i.test(`${m.lane || ''} ${m.title || ''} ${m.name || ''}`) ? 'wide' : 'tall';
}
document.addEventListener('loadedmetadata', (e) => {
  const v = e.target; const box = v.closest && v.closest('[data-vid]');
  if (!box || !v.videoWidth) return;
  const shape = v.videoWidth > v.videoHeight ? 'wide' : 'tall';
  if (SHAPES[box.dataset.vid] === shape) return;
  SHAPES[box.dataset.vid] = shape;
  try { localStorage.setItem('vshape', JSON.stringify(SHAPES)); } catch {}
  if (!box.classList.contains(shape)) { box.classList.remove('tall', 'wide'); box.classList.add(shape); } // 짐작이 틀렸을 때 한 번만 바뀐다
}, true);
const mediaById = (id) => (S.media || []).find((m) => m.id === id);
function mediaEl(m, big) {
  if (!m) return '';
  if (m.mime.startsWith('video/')) return `<div class="vbox ${videoShape(m)} ${big ? 'big' : ''}" data-vid="${esc(m.id)}"><video class="media" src="${esc(m.url)}#t=0.1" controls preload="metadata" playsinline></video></div>`;
  if (m.mime.startsWith('image/')) return `<a href="${esc(m.url)}" target="_blank" rel="noopener"><img class="media ${big ? 'big' : ''}" src="${esc(m.url)}" loading="lazy" alt="${esc(m.title)}"></a>`;
  if (m.mime.startsWith('audio/')) return `<audio src="${esc(m.url)}" controls preload="none" style="width:100%"></audio>`;
  return `<a class="opt" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)} 열기</a>`;
}
function mediaCard(m) {
  const d = m.decision_id && S.decisions.find((x) => x.id === m.decision_id);
  return `<div class="mcard ${m.mime.startsWith('video/') && videoShape(m) === 'wide' ? 'wide' : ''}">${mediaEl(m)}
    <div class="mb"><div class="dtop">${m.lane ? `<span class="lane">${esc(m.lane)}</span>` : '<span></span>'}<span class="muted">${ago(Date.parse(m.at))}</span></div>
      <div class="mt">${esc(m.title)}</div>
      <div class="muted ss">${esc(m.from || devName(m.device || ''))}${m.size ? ` · ${(m.size / 1048576).toFixed(1)}MB` : ''}</div>
      ${d ? (d.status === 'open' ? `<button class="small primary" data-act="page:decisions">검수 결정 대기 · 답하기</button>` : `<div class="ans">→ ${esc(d.answer)}</div>`) : ''}
      ${m.note ? `<div class="muted">${esc(m.note)}</div>` : ''}</div></div>`;
}
function renderResults() {
  const all = (S.media || []).filter((m) => !m.by_owner);
  const lanes = [...new Set(all.map((m) => m.lane).filter(Boolean))];
  const list = view.mlane ? all.filter((m) => m.lane === view.mlane) : all;
  return head('결과물', '세션이 올린 샘플 · 14일 보관') + `<div class="body">
    ${lanes.length ? `<div class="tabs ptabs"><div class="tab ${!view.mlane ? 'on' : ''}" data-mlane="">전체 ${all.length}</div>${lanes.map((l) => `<div class="tab ${view.mlane === l ? 'on' : ''}" data-mlane="${esc(l)}">${esc(l)}</div>`).join('')}</div>` : ''}
    ${list.length ? `<div class="mgrid">${list.map(mediaCard).join('')}</div>` : '<div class="card empty">아직 올라온 결과물이 없습니다. 세션이 office/share.js 로 올리면 여기 보입니다.</div>'}</div>`;
}

// ── 대화창: 총괄(오피스 담당)·프로젝트 담당 세션에 바로 말하기, 스크린샷 첨부 ──
const CHAT = {};    // key → 세션
const ATTACH = {};  // key → [{id, url, name}]
const DRAFTS = {};  // key → 입력 중인 글(15초 새로고침에도 남게)
const cleanTitle = (t) => String(t || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
// «YTHOME-SF-JP 린박스 C» 같은 세션 코드를 소유주가 읽는 이름으로: 린박스 · 유튜브 일본 쇼츠
function nice(t) {
  const c = cleanTitle(t);
  let m = c.match(/^YTHOME-(SF|LF)-(KO|JP)\s*(.*)$/);
  if (m) return { name: m[3].replace(/\s+[A-Z]$/, '') || '이름 없음', kind: `유튜브 ${m[2] === 'KO' ? '한국' : '일본'} ${m[1] === 'SF' ? '쇼츠' : '롱폼'}` };

// 비우기 추천: 큰 대화 × 자주 깨는 세션일수록 비웠을 때 아끼는 양이 크다. 지금 비우면 곤란한 세션은 «나중에»로.
const PLAN_MIN = 150000;
function compactPlan(M) {
  const openBy = (s) => S.decisions.filter((d) => d.status === 'open' && cleanTitle(d.asked_by || '').startsWith(cleanTitle(s.title)));
  const locked = new Set(S.devices.filter((d) => (d.state?.render_locks || []).length).map((d) => d.device));
  const now = [], later = [];
  for (const s of M.all) {
    if (s.agent !== 'claude' || !s.online || !s.context_tokens || s.context_tokens < PLAN_MIN || s.compacting) continue;
    const idleH = (Date.now() - (s.last_output_at || 0)) / 36e5;
    const activity = idleH < 3 ? 1 : idleH < 12 ? 0.6 : idleH < 24 ? 0.3 : 0.1; // 최근에 일할수록 앞으로도 자주 깬다
    const item = { s, score: s.context_tokens * activity, idleH };
    const dec = openBy(s);
    if (s.status === 'busy') later.push({ ...item, why: '지금 작업 중 — 이 턴이 끝난 뒤' });
    else if (dec.length) later.push({ ...item, why: `결정 ${dec.map((d) => '#' + d.id).join('·')} 답을 기다리는 중 — 답한 뒤` });
    else if (locked.has(s.device) && /정치/.test(s.title || '')) later.push({ ...item, why: '정치 렌더 중 — 렌더 끝난 뒤' });
    else if (idleH >= 24) later.push({ ...item, why: '하루 넘게 쉬는 중 — 깨우지 않으면 비용 0, 급하지 않음' });
    else now.push({ ...item, why: idleH < 3 ? '최근에 자주 일함 — 턴마다 이만큼 다시 읽음' : `${Math.round(idleH)}시간 전까지 일함` });
  }
  now.sort((a, b) => b.score - a.score); later.sort((a, b) => b.score - a.score);
  return { now, later };
}
function planCard(M) {
  const { now, later } = compactPlan(M);
  if (!now.length && !later.length) return '';
  const row = (x, i, ok) => `<div class="prow">
    <span class="pn2 ${ok ? '' : 'muted'}">${ok ? i + 1 : '·'}</span>
    <div class="pm"><b>${niceHtml(x.s.title)}</b><div class="muted">${esc(x.why)}</div></div>
    <span class="ctx c-${ctxTone(x.s.context_tokens)}"><span>${fmtK(x.s.context_tokens)}</span></span>
    ${ok ? `<button class="small primary" data-compact="${esc(x.s.handle)}">비우기</button>` : '<button class="small" disabled>나중에</button>'}</div>`;
  const save = now.reduce((a, x) => a + x.s.context_tokens, 0);
  return `<div class="card plan"><h2>비우기 추천 <span class="muted">${now.length ? `지금 ${now.length}개 비우면 다음 턴마다 약 ${fmtK(save)} 토큰 덜 읽음` : '지금 비울 세션 없음'}</span></h2>
    ${now.map((x, i) => row(x, i, true)).join('')}${later.length ? `<div class="muted plater">나중에</div>${later.map((x, i) => row(x, i, false)).join('')}` : ''}</div>`;
}

      <div><button class="small danger" data-close="${esc(handle)}">세션 닫기</button> <button class="small" data-act="panel-x">✕</button></div></div>
      <div class="meta"></div></div>
    <div class="screen" id="screen">화면을 불러오는 중…</div>
    <div class="quick">${QUICK.map(([t], i) => `<button class="small" data-quick="${i}">${t}</button>`).join('')}</div>
    <div class="composer"><textarea id="msg" rows="2" placeholder="이 세션에 보낼 말 — Enter 로 보내기, Shift+Enter 줄바꿈"></textarea><button class="primary" data-act="send">보내기</button></div>`;
  render();
  refreshScreen(true);
  clearInterval(panelTimer);
  panelTimer = setInterval(refreshScreen, 4000);
  $('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } });
}
function closePanel() {
  clearInterval(panelTimer); view.session = null;
  $('panel').hidden = true; $('app').classList.remove('with-panel'); render();
}
async function refreshScreen(first) {
  const s = findSession(view.session);
  if (!s) return;
  if (!s.online) { $('screen').textContent = '기기가 꺼져 있어 화면을 볼 수 없습니다.\n\n마지막 화면:\n' + (s.preview || ''); return; }
  const r = await cmd(s.device, 'read', { handle: s.handle }).catch(() => null);
  const el = $('screen'); if (!el) return;
  const term = r?.result?.terminal || r?.result || {};
  const text = r?.ok ? (term.tail || '') : (first ? `화면을 읽지 못했습니다: ${r?.error || ''}` : null);
  if (text == null) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.textContent = Array.isArray(text) ? text.join('\n') : text;
  if (first || atBottom) el.scrollTop = el.scrollHeight;
}
async function sendText(text) {
  const s = findSession(view.session);
  if (!s || !text.trim()) return;
  const r = await cmd(s.device, 'send', { handle: s.handle, text }, s.title);
  toast(r.ok ? '보냈습니다' : `못 보냈습니다: ${r.error}`);
  setTimeout(() => refreshScreen(), 1500);
}
function sendMsg() { const t = $('msg').value; if (!t.trim()) return; $('msg').value = ''; sendText(t); }

// ── 모달 ──
// «GPT 손»: 화면 조작 Codex 세션. 기기 연결기가 caps.computer_use 를 알려 준다(구버전 연결기는 없음 → «준비 필요»).
function cuButton(d) {
  if (!d.online || d.device === 'vps') return '';
  const open = (d.state?.sessions || []).find((x) => cleanTitle(x.title).startsWith('GPT 손'));
  if (open) return `<button class="small" data-open="${esc(open.handle)}">GPT 손 보기</button>`;
  if (!d.state?.caps) return '<span class="muted small-note">GPT 손 준비 필요</span>';
  return d.state.caps.computer_use ? `<button class="small" data-cu="${esc(d.device)}">GPT 손 열기</button>` : '<span class="muted small-note">GPT 손 불가</span>';
}
async function launchCu(device, force) {
  toast('GPT 손 여는 중…');
  const r = await cmd(device, 'launch_cu', { force: !!force }, 'GPT 손');
  if (r.ok) { toast('GPT 손을 열었습니다 — 오른쪽 대화로 일을 시키세요'); return setTimeout(load, 5000); }
  if (/강행/.test(r.error || '')) {
    return modal(`<h3>GPT 손 열기</h3><div>${esc(devName(device))}을(를) 지금 누군가 쓰고 있는 것 같습니다. 열면 GPT가 마우스·키보드를 씁니다. 그래도 열까요?</div>`, () => { launchCu(device, true); });
  }
  toast(`못 열었습니다: ${r.error}`);
}
// «담당에게 묻기»: 카드 내용을 통째로 담아 담당 세션에 바로 보낸다. 덧붙일 말은 선택.
function askManager(c) {
  const key = view.page === 'project' ? `pm:${view.project}` : 'office';
  const sess = CHAT[key];
  if (!sess) return toast('담당 세션이 없습니다');
  const lines = [`[오피스 · 소유주 · 카드 질문] ${c.title}`, c.sub && `요약: ${c.sub}`, c.detail && `상황: ${c.detail}`, c.rec && `화면 추천: ${c.rec}`, c.session && `맡은 세션: ${c.session}`].filter(Boolean);
  const m = modal(`<h3>${esc(nice(sess.title).name)}에게 묻기</h3>
    <div class="askprev">${lines.slice(1).map((l) => `<div>${esc(l)}</div>`).join('')}</div>
    <textarea rows="3" data-askq placeholder="더 물을 말 (비워 두면: 어떻게 할지 판단해서 처리하고, 내가 정할 게 있으면 결정으로 올려 줘)"></textarea>`, async (box) => {
    const q = box.querySelector('[data-askq]').value.trim() || '어떻게 할지 판단해서 처리해 줘. 내가 정할 게 있으면 결정으로 올려 줘.';
    const r = await cmd(sess.device, 'send', { handle: sess.handle, text: [...lines, `질문: ${q}`].join('\n') }, sess.title);
    if (!r.ok) { toast(`못 보냈습니다: ${r.error}`); return true; }
    toast(r.result?.queued ? '보냈습니다 — 담당이 하던 일을 끝내고 읽습니다' : '보냈습니다');
  });
  m.querySelector('[data-ok]').textContent = '보내기';
  setTimeout(() => m.querySelector('[data-askq]').focus(), 50);
}
function modal(html, onOk) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}<div class="btns"><button data-x>취소</button><button class="primary" data-ok>확인</button></div></div>`;
  document.body.append(m);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  m.querySelector('[data-ok]').onclick = async () => { const keep = await onOk(m); if (!keep) m.remove(); };
  return m;
}
function newSession() {
  const M = model();
  const targets = [];
  // 세션이 실제로 일하는 폴더(작업 트리)를 먼저, 그다음 저장소 본 폴더.
  const seen = new Set();
  const add = (p, device, folder, where) => {
    const k = device + '|' + folder.replace(/\\/g, '/').toLowerCase();
    if (seen.has(k)) return; seen.add(k);
    targets.push({ label: `${p.name} — ${devName(device)} · ${where}`, device, folder, pkey: p.key });
  };
  for (const p of M.projects) {
    for (const s of p.sessions) if (s.online && s.folder) add(p, s.device, s.folder, s.folder.split(/[\\/]/).filter(Boolean).slice(-1)[0]);
    for (const r of p.repos) if (r.online) add(p, r.device, r.path, '본 폴더');
  }
  if (!targets.length) return toast('연결된 기기의 프로젝트가 없습니다');
  const pre = targets.findIndex((t) => t.pkey === view.project);
  modal(`<h3>새 세션 열기</h3>
    <label>프로젝트 · 기기<select id="nt">${targets.map((t, i) => `<option value="${i}" ${i === pre ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label>
    <label>에이전트<select id="na"><option value="claude">클로드</option><option value="codex">GPT (코덱스)</option></select></label>
    <label>세션 이름<input id="nn" placeholder="예: 그로우업 상세 페이지"></label>
    <label>첫 메시지 (인계 파일 경로나 할 일)<textarea id="np" rows="3"></textarea></label>`, async (m) => {
    const t = targets[+m.querySelector('#nt').value];
    const name = m.querySelector('#nn').value.trim(), first = m.querySelector('#np').value.trim();
    const prompt = [name ? `이 세션 이름은 «${name}» 이다. /rename 으로 이름을 바꿔라.` : '', first].filter(Boolean).join('\n') || undefined;
    toast('세션을 여는 중…');
    const r = await cmd(t.device, 'launch', { folder: t.folder, agent: m.querySelector('#na').value, prompt, title: name || t.label }, name || t.label);
    toast(r.ok ? '세션을 열었습니다' : `열지 못했습니다: ${r.error}`);
    setTimeout(load, 4000);
  });
}
function compactSession(handle) {
  const s = findSession(handle); if (!s) return;
  modal(`<h3>대화 비우기</h3><div>«${esc(niceTitle(s.title))}» 의 대화를 비웁니다. 지금 대화 ${s.context_tokens ? fmtK(s.context_tokens) + ' 토큰' : ''} — 이 세션은 한 턴마다 이만큼을 다시 읽습니다.</div>
    <div class="muted">순서: 하던 턴이 끝나길 기다림 → 세션이 인계 파일을 씀 → 파일 확인 → 대화 비우기 → 인계 파일로 다시 시작. 몇 분 걸리고, 인계 파일이 안 써지면 비우지 않습니다.</div>`, async () => {
    const r = await cmd(s.device, 'compact', { handle, title: s.title }, s.title);
    toast(r.ok ? '비우기를 시작했습니다 · 끝나면 기록에 남습니다' : `시작하지 못했습니다: ${r.error}`);
    setTimeout(load, 3000);
  });
}
function closeSession(handle) {
  const s = findSession(handle); if (!s) return;
  const d = S.devices.find((x) => x.device === s.device);
  const locks = d?.state?.render_locks || [];
  modal(`<h3>세션 닫기</h3><div>«${esc(niceTitle(s.title))}» (${esc(devName(s.device))}) 를 닫을까요?</div>
    <div class="muted">마지막 활동 ${ago(s.last_output_at)} · ${STATUS_TEXT[s.status]}<br>닫으면 이 세션의 대화는 끝납니다. 이어서 할 일이 있으면 먼저 «마무리 요청»으로 인계 파일을 남기세요.</div>
    ${s.status === 'busy' ? '<div style="color:var(--warn)">지금 작업 중인 세션입니다.</div>' : ''}
    ${locks.length ? `<div style="color:var(--bad)">이 기기에서 렌더가 진행 중입니다 (${locks.length}). 그래도 닫으려면 확인을 누르세요.</div>` : ''}`, async () => {
    const r = await cmd(s.device, 'close', { handle, title: s.title, force: locks.length > 0 }, s.title);
    toast(r.ok ? '닫았습니다' : `닫지 못했습니다: ${r.error}`);
    if (r.ok && view.session === handle) closePanel();
    setTimeout(load, 3000);
  });
}
async function answer(id, value, label) {
  if (!value) {
    const head = label ? `<h3>${esc(label)} — 무엇을 어떻게 할지 적어 주세요</h3>` : '<h3>선택지에 없는 답 쓰기</h3>';
    return modal(head + '<textarea id="av" rows="4" placeholder="예: 제목은 그대로, 첫 3초 장면만 바꿔"></textarea>', async (m) => {
      const v = m.querySelector('#av').value.trim(); if (!v) return true; await answer(id, label ? `${label}: ${v}` : v);
    });
  }
  const r = await call(`/api/decisions/${id}`, { answer: value });
  toast(r.ok ? (r.delivered ? `답했습니다 · ${r.delivered}` : '답했습니다') : (r.error || '실패'));
  load();
}

// ── 이벤트 ──
document.addEventListener('click', (e) => {
  // 서랍이 열려 있으면 바깥을 누를 때 닫기만 한다
  if ($('side').classList.contains('open') && !e.target.closest('#side, [data-act="menu"]')) { $('side').classList.remove('open'); return; }
  const t = e.target.closest('[data-page],[data-project],[data-session],[data-open],[data-close],[data-qsend],[data-compact],[data-askmgr],[data-act],[data-tab],[data-ptab],[data-mlane],[data-chat],[data-unattach],[data-mkmanager],[data-quick],[data-answer],[data-cu]');
  if (t && t.dataset.compact) return compactSession(t.dataset.compact);
  if (t && t.dataset.askmgr) return askManager(JSON.parse(t.dataset.askmgr));
  if (t && t.dataset.qsend) {
    // 카드의 «진행 상황»: 그 세션에 진행 상황 질문을 넣고, 패널을 열어 답을 본다.
    const s = findSession(t.dataset.qsend); if (!s) return;
    openPanel(s.handle); return sendText(QUICK[1][1]);
  }
  if (!t) return;
  if (t.dataset.close) { e.stopPropagation(); return closeSession(t.dataset.close); }
  if (t.dataset.open) { e.stopPropagation(); return openPanel(t.dataset.open); }
  if (t.dataset.answer) {
    // 잘못 누름 방지: 선택지는 한 번 누르면 «한 번 더 눌러 확정», 3초 안에 다시 누르면 답한다.
    if (!t.dataset.value) return answer(t.dataset.answer, '');
    if (NEEDS_NOTE.test(t.dataset.value)) return answer(t.dataset.answer, '', t.dataset.value);
    if (!t.classList.contains('armed')) {
      document.querySelectorAll('.opt.armed').forEach((b) => { b.classList.remove('armed'); b.querySelector('em')?.remove(); });
      t.classList.add('armed'); t.insertAdjacentHTML('beforeend', '<em>한 번 더 눌러 확정</em>');
      setTimeout(() => { t.classList.remove('armed'); t.querySelector('em')?.remove(); }, 3000);
      return;
    }
    t.disabled = true;
    return answer(t.dataset.answer, t.dataset.value);
  }
  if (t.dataset.quick) return sendText(QUICK[+t.dataset.quick][1]);
  if (t.dataset.tab) { view.tab = t.dataset.tab; return render(); }
  if (t.dataset.mlane != null && t.classList.contains('tab')) { view.mlane = t.dataset.mlane || null; return render(); }
  if (t.dataset.chat) return sendChat(t.dataset.chat);
  if (t.dataset.mkmanager) return makeManager(t.dataset.mkmanager);
  if (t.dataset.cu) return launchCu(t.dataset.cu);
  if (t.dataset.unattach) { const [k, i] = t.dataset.unattach.split(/:(?=\d+$)/); ATTACH[k].splice(+i, 1); return render(); }
  if (t.dataset.ptab) { view.ptab = t.dataset.ptab; return render(); }
  if (t.dataset.session) { $('side').classList.remove('open'); return openPanel(t.dataset.session); }
  if (t.dataset.project) { view.page = 'project'; view.project = t.dataset.project; $('side').classList.remove('open'); return render(); }
  if (t.dataset.page) { view.page = t.dataset.page; $('side').classList.remove('open'); return render(); }
  const a = t.dataset.act;
  if (a === 'new') return newSession();
  if (a === 'send') return sendMsg();
  if (a === 'panel-x') return closePanel();
  if (a === 'menu') return $('side').classList.toggle('open');
  if (a && a.startsWith('page:')) { view.page = a.slice(5); window.scrollTo(0, 0); return render(); }
  if (a === 'tab:big') { view.page = 'tidy'; view.tab = 'big'; return render(); }
  if (a && a.startsWith('project:')) { view.page = 'project'; view.project = a.slice(8); return render(); }
  if (a === 'expand') return t.classList.toggle('clamp');
  if (a === 'fab') return toggleFab();
  if (a === 'xpand') { if (e.target.closest('button')) return; return t.classList.toggle('open'); }
  if (a === 'drawer') return $('side').classList.toggle('open');
});

// ── 홈 화면 앱·푸시 알림 ──
let swReg = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').then((r) => { swReg = r; renderPush(); }).catch(() => {});
const b64ToBytes = (b) => { const p = '='.repeat((4 - b.length % 4) % 4); const s = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
async function renderPush() {
  const box = $('pushbox'); if (!box) return;
  if (!swReg || !('PushManager' in window) || !OFFICE.vapid) { box.innerHTML = ''; return; }
  const sub = await swReg.pushManager.getSubscription();
  box.innerHTML = sub && Notification.permission === 'granted'
    ? '<div><span class="dot d-idle"></span>이 기기 알림 켜짐 <button class="small" style="margin-left:auto" data-act="push-test">시험</button></div>'
    : Notification.permission === 'denied'
      ? '<div>알림이 막혀 있습니다. 브라우저 사이트 설정에서 허용해 주세요.</div>'
      : '<button class="small primary" style="width:100%" data-act="push-on">이 기기에서 알림 켜기</button>';
}
async function pushOn() {
  if (await Notification.requestPermission() !== 'granted') return renderPush();
  const sub = (await swReg.pushManager.getSubscription()) || await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(OFFICE.vapid) });
  const r = await call('/api/push/subscribe', { subscription: sub.toJSON() });
  toast(r.ok ? '알림을 켰습니다' : '알림을 켜지 못했습니다');
  if (r.ok) await call('/api/push/test', {});
  renderPush();
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'push-on') pushOn();
  if (a === 'push-test') call('/api/push/test', {}).then((r) => toast(r.ok ? '시험 알림을 보냈습니다' : '보내지 못했습니다'));
});
// 알림을 눌러 들어오면 해당 화면으로(#decisions 등).
function routeFromHash() { const h = location.hash.slice(1); if (['decisions', 'tidy', 'log', 'home', 'results'].includes(h)) view.page = h; }
// 대화창: 파일 붙이기·입력 중인 글 기억·Enter 로 보내기
document.addEventListener('change', (e) => { const k = e.target.dataset?.attach; if (k && e.target.files.length) attachFiles(k, [...e.target.files]); });
document.addEventListener('input', (e) => { const k = e.target.dataset?.draft; if (k) DRAFTS[k] = e.target.value; });
document.addEventListener('keydown', (e) => { const k = e.target.dataset?.draft; if (k && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(k); } });
window.addEventListener('hashchange', () => { routeFromHash(); render(); });
routeFromHash();

async function show() {
  const { data: { session } } = await sb.auth.getSession();
  $('login').hidden = !!session; $('app').hidden = !session;
  if (session) { load(); clearInterval(window.__t); window.__t = setInterval(load, 15e3); }
}
$('go').onclick = async () => {
  $('err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) $('err').textContent = '로그인하지 못했습니다.'; else show();
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
show();
</script>
