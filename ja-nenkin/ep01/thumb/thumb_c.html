<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(NotoSansJP.ttf);font-weight:100 900}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:N}
body{background:#ffffff;position:relative}

.line{position:absolute;left:48px;top:356px;width:660px;height:10px;background:#1e7a46;border-radius:5px}
.sub{position:absolute;left:44px;top:392px;font-size:96px;font-weight:900;color:#1e7a46;line-height:1.12}

<div class="side"></div><img class="form" src="form_p1.png">

</body></html>
